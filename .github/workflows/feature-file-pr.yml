name: Check PR for Feature Files

on:
  pull_request:
    branches: [ "main" ]

permissions:
  issues: write
  pull-requests: write

jobs:
  check:
    name: Check PR
    runs-on: ubuntu-latest
    outputs:
      body-found: ${{ steps.feature.outputs.body-found }}
      summary: ${{ steps.feature.outputs.summary }}
      modFiles: ${{ steps.feature.outputs.modFiles }}
      addFiles: ${{ steps.feature.outputs.addFiles }}
      remFiles: ${{ steps.feature.outputs.remFiles }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        id: files
        uses: Ana06/get-changed-files@a6591c950d92e67595be3ccd71324cef32c4b7ab #v2.1.0

      - name: Generate Feature File summary
        id: feature
        uses: mqole/featurefile-pr-action@1d6de080d5edb175dc845d977e94c915cc7faf2c
        with:
          modified: ${{ steps.files.outputs.modified }}
          removed: ${{ steps.files.outputs.removed }}
          added: ${{ steps.files.outputs.added }}
          basename: ${{ github.event.pull_request.base.repo.full_name }}
          basesha: ${{ github.event.pull_request.base.sha }}
          headname: ${{ github.event.pull_request.head.repo.full_name }}
          headsha: ${{ github.event.pull_request.head.sha }}

  write:
    name: Write Feature File
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.body-found == 'true' }}
    # outputs:
    #   fileList: ${{ steps.getfiles.outputs.fileList }}
    steps:
      - name: Checkout Main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: syndicate-ss14/docs
          path: main
      - name: Get all existing Feature Files
        id: getfiles
        run: |
          # get files from docs repo
          cd main/docs
          files=($(ls *.md))
          echo ${files}
          # get array of all feature files we need to consider,
          for element in ${{ needs.check.outputs.modFiles }} ${{ needs.check.outputs.addFiles }} ${{ needs.check.outputs.remFiles }} do
          filesChanged+=("element")
          done
          echo ${{ needs.check.outputs.modFiles }}
          echo ${{ needs.check.outputs.addFiles }}
          echo ${{ needs.check.outputs.remFiles }}
          echo ${filesChanged}
